<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Scripted desktop peer</title>
  <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
</head>
<body>
<script type="module">
  // Plays the desktop app's side of PROTOCOL.md for the tests, the pairing check included.
  import { negotiatedFingerprints, proof, sameProof, toBase64Url } from "../auth.js";

  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  // ?stall=1: take the phone's offer but never answer, as when no route between the two works.
  if (params.get("stall")) RTCPeerConnection.prototype.setRemoteDescription = () => new Promise(() => {});
  const fixtures = await (await fetch("fixtures/messages.json")).json();
  const example = type => fixtures.appToPhone.find(m => m.type === type);
  const peer = new Peer(id, { host: "localhost", port: 9123, path: "/", secure: false, config: { iceServers: [] } });
  let conn = null;
  const desk = {
    received: [],
    refuse: false,
    /** What the app reports in welcome; null leaves it out, as apps before 0.25.0 do. */
    appVersion: "0.26.0",
    /** What the app lets the phone do, as welcome says; "images" when its sharing setting is on. */
    features: [],
    /** The QR code's secret; the helpers put the same one in the phone's link. */
    code: params.get("code"),
    /** What the phone that paired was given, for its reconnects. */
    deviceKey: null,
    /** Act as an app from before the pairing check: send no challenge. */
    noAuth: false,
    /** Prove the app with the wrong secret, as an impostor would. */
    badProof: false,
    connections: 0,
    sessions: example("sessions").sessions,
    /**
     * What `openImage` finds, by reference: `{ type, bytes }` (a Uint8Array) or `{ error }`; a
     * reference that isn't here gets no answer. `stopAfter: n` sends only the first n pieces,
     * holding the rest and `imageDone` for `release`; `skip: i` leaves piece i out.
     */
    images: {},
    /** The ids the phone sent `cancelImage` for. */
    cancelled: [],
    /** What `stopAfter` held back, by request id. */
    held: {},
    /** Sends what `stopAfter` held back for request `id`, cancelled or not, as if already on its way. */
    release(id) {
      for (const m of desk.held[id] ?? []) desk.send(m);
      delete desk.held[id];
    },
    send(m) { conn?.send({ v: 1, ...m }); },
    closeConnection() { conn?.close(); conn = null; },
    destroy() { peer.destroy(); },
  };
  window.desk = desk;

  /** The most an `imagePiece` holds, as the app sends them. */
  const PIECE_BYTES = 64 * 1024;

  function answerImage(m) {
    const found = desk.images[m.ref];
    if (!found) return;
    const reply = { type: "image", id: m.id, sessionId: m.sessionId, ref: m.ref };
    if (found.error) {
      desk.send({ ...reply, error: found.error });
      return;
    }
    const pieces = Math.ceil(found.bytes.length / PIECE_BYTES);
    desk.send({ ...reply, mime: found.type, size: found.bytes.length, pieces });
    const rest = [];
    for (let index = 0; index < pieces; index++) {
      if (index === found.skip) continue;
      rest.push({ type: "imagePiece", id: m.id, index, data: found.bytes.slice(index * PIECE_BYTES, (index + 1) * PIECE_BYTES) });
    }
    rest.push({ type: "imageDone", id: m.id });
    const now = found.stopAfter === undefined ? rest : rest.slice(0, found.stopAfter);
    for (const piece of now) desk.send(piece);
    if (now.length < rest.length) desk.held[m.id] = rest.slice(now.length);
  }

  const newSecret = () => toBase64Url(crypto.getRandomValues(new Uint8Array(32)));

  async function check(c, m, nonce) {
    // The desk's side of the link: its own certificate is the local one.
    const f = await negotiatedFingerprints(c.peerConnection);
    const fps = { app: f?.local ?? "", phone: f?.remote ?? "" };
    const key = m.kind === "pair" ? desk.code : desk.deviceKey;
    const ok = !!key && sameProof(await proof(key, "phone", nonce, fps.app, fps.phone), m.proof);
    if (!ok) {
      c.send({ v: 1, type: "goodbye", reason: "refused" });
      c.close();
      return;
    }
    const issued = m.kind === "pair" ? newSecret() : undefined;
    const appProof = await proof(desk.badProof ? newSecret() : key, "app", nonce, fps.app, fps.phone);
    if (issued) {
      desk.deviceKey = issued;
      desk.code = null;
    }
    c.authed = true;
    conn = c;
    desk.connections += 1;
    c.send({ v: 1, type: "authed", proof: appProof, ...(issued ? { deviceKey: issued } : {}) });
  }

  peer.on("connection", c => {
    let nonce = null;
    c.on("open", () => {
      if (desk.refuse) { c.close(); return; }
      if (desk.noAuth) {
        c.authed = true;
        conn = c;
        desk.connections += 1;
        return;
      }
      nonce = newSecret();
      c.send({ v: 1, type: "challenge", nonce });
    });
    c.on("data", m => {
      desk.received.push(m);
      if (!c.authed) {
        if (m.type === "auth" && nonce) check(c, m, nonce);
        return;
      }
      if (m.type === "hello") {
        c.send({ v: 1, type: "welcome", deviceId: m.clientId, appVersion: desk.appVersion, features: desk.features });
        c.send({ v: 1, type: "sessions", sessions: desk.sessions });
      }
      if (m.type === "disconnect") {
        c.send({ v: 1, type: "goodbye", reason: "disconnected" });
        c.close();
      }
      if (m.type === "openImage") answerImage(m);
      if (m.type === "cancelImage") desk.cancelled.push(m.id);
      if (m.type === "openSession") {
        const convo = example("conversation");
        c.send({ ...convo, sessionId: m.sessionId });
        c.send({ v: 1, type: "prompt", sessionId: m.sessionId, card: null });
      }
    });
  });
  await new Promise(resolve => peer.on("open", resolve));
  window.deskReady = true;
</script>
</body>
</html>

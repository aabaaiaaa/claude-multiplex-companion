<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Scripted desktop peer</title>
  <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
</head>
<body>
<script type="module">
  // Plays the desktop app's side of PROTOCOL.md for the tests, the pairing check included.
  import { fromBase64Url, negotiatedFingerprints, proof, sameProof, toBase64Url } from "../auth.js";

  // The app's screen-lock checks, written out here rather than taken from the page, so a page
  // that builds its answers wrong fails them.
  const utf8 = s => new TextEncoder().encode(s);
  const sha256 = async bytes => new Uint8Array(await crypto.subtle.digest("SHA-256", bytes));
  const sameBytes = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);
  const uvChallenge = async (nonce, appFp, phoneFp) => toBase64Url(await sha256(utf8(["cmx-companion uv v1", nonce, appFp, phoneFp].join("\n"))));

  /** WebAuthn's DER signature as the raw r‖s WebCrypto checks. */
  function derToRaw(der) {
    if (der[0] !== 0x30) return null;
    const out = new Uint8Array(64);
    let i = 2;
    for (let k = 0; k < 2; k++) {
      if (der[i] !== 0x02) return null;
      const len = der[i + 1];
      let v = der.slice(i + 2, i + 2 + len);
      while (v.length > 32 && v[0] === 0) v = v.slice(1);
      if (v.length > 32) return null;
      out.set(v, k * 32 + 32 - v.length);
      i += 2 + len;
    }
    return out;
  }

  /** The parts both checks share; a reason string when something is off. */
  async function readSigned(m, type) {
    const authData = fromBase64Url(m.authenticatorData);
    const clientBytes = fromBase64Url(m.clientDataJSON);
    if (!authData || authData.length < 37 || !clientBytes) return "malformed";
    const client = JSON.parse(new TextDecoder().decode(clientBytes));
    if (client.type !== type) return "wrong type";
    if (client.origin !== location.origin || client.crossOrigin === true) return "wrong origin";
    if (!sameBytes(authData.slice(0, 32), await sha256(utf8(location.hostname)))) return "wrong site";
    if (!(authData[32] & 0x01)) return "no user present";
    if (!(authData[32] & 0x04)) return "screen lock not checked";
    return { authData, clientBytes, client, count: new DataView(authData.buffer).getUint32(33) };
  }

  async function checkEnrolment(m) {
    if (m.alg !== -7) return "unsupported key type";
    const r = await readSigned(m, "webauthn.create");
    if (typeof r === "string") return r;
    if (!(r.authData[32] & 0x40)) return "malformed";
    try {
      const key = await crypto.subtle.importKey("spki", fromBase64Url(m.publicKey), { name: "ECDSA", namedCurve: "P-256" }, false, ["verify"]);
      return { credentialId: m.credentialId, key, count: r.count };
    } catch {
      return "unusable key";
    }
  }

  async function checkAssertion(cred, a, challenge) {
    if (!a) return "no credential";
    if (a.credentialId !== cred.credentialId) return "unknown credential";
    const r = await readSigned(a, "webauthn.get");
    if (typeof r === "string") return r;
    if (r.client.challenge !== challenge) return "wrong challenge";
    if ((r.count !== 0 || cred.count !== 0) && r.count <= cred.count) return "replayed or cloned";
    const raw = derToRaw(fromBase64Url(a.signature) ?? new Uint8Array());
    const signed = new Uint8Array([...r.authData, ...(await sha256(r.clientBytes))]);
    if (!raw || !await crypto.subtle.verify({ name: "ECDSA", hash: "SHA-256" }, cred.key, raw, signed)) return "bad signature";
    cred.count = r.count;
    return null;
  }

  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  // ?stall=1: take the phone's offer but never answer, as when no route between the two works.
  if (params.get("stall")) RTCPeerConnection.prototype.setRemoteDescription = () => new Promise(() => {});
  const fixtures = await (await fetch("fixtures/messages.json")).json();
  const example = type => fixtures.appToPhone.find(m => m.type === type);
  const peer = new Peer(id, { host: "localhost", port: 9123, path: "/", secure: false, config: { iceServers: [] } });
  let conn = null;
  const desk = {
    received: [],
    refuse: false,
    /** What the app reports in welcome; null leaves it out, as apps before 0.25.0 do. */
    appVersion: "0.26.0",
    /** What the app lets the phone do, as welcome says; "images" when its sharing setting is on. */
    features: [],
    /** The QR code's secret; the helpers put the same one in the phone's link. */
    code: params.get("code"),
    /** What the phone that paired was given, for its reconnects. */
    deviceKey: null,
    /** Act as an app from before the pairing check: send no challenge. */
    noAuth: false,
    /** Prove the app with the wrong secret, as an impostor would. */
    badProof: false,
    /** The app's screen lock setting: a phone sets the lock up before it's let in, then needs it. */
    requireUV: false,
    /** The app's confirmation of a new pairing: it waits for `confirm(ok)`, as the person at the PC. */
    confirmPairing: false,
    /** Whether this pairing's phone was confirmed. */
    confirmed: false,
    /** The code both ends show while it waits. */
    confirmCode: "482913",
    /** Answers for the person at the PC: in, or turned away. */
    confirm(ok) {
      const c = waiting;
      waiting = null;
      if (!c) return;
      c.confirming = false;
      if (!ok) {
        c.send({ v: 1, type: "goodbye", reason: "refused" });
        c.close();
        return;
      }
      desk.confirmed = true;
      c.send({ v: 1, type: "pairingConfirmed" });
      letIn(c);
    },
    /** The phone's credential, once its `enrol` passed. */
    uvCred: null,
    /** Each screen lock check's outcome: null for passed, else why not. */
    uvChecks: [],
    connections: 0,
    sessions: example("sessions").sessions,
    /**
     * What `openImage` finds, by reference: `{ type, bytes }` (a Uint8Array) or `{ error }`; a
     * reference that isn't here gets no answer. `stopAfter: n` sends only the first n pieces,
     * holding the rest and `imageDone` for `release`; `skip: i` leaves piece i out.
     */
    images: {},
    /** The ids the phone sent `cancelImage` for. */
    cancelled: [],
    /** What `stopAfter` held back, by request id. */
    held: {},
    /** Sends what `stopAfter` held back for request `id`, cancelled or not, as if already on its way. */
    release(id) {
      for (const m of desk.held[id] ?? []) desk.send(m);
      delete desk.held[id];
    },
    send(m) { conn?.send({ v: 1, ...m }); },
    closeConnection() { conn?.close(); conn = null; },
    destroy() { peer.destroy(); },
  };
  window.desk = desk;

  /** The most an `imagePiece` holds, as the app sends them. */
  const PIECE_BYTES = 64 * 1024;

  function answerImage(m) {
    const found = desk.images[m.ref];
    if (!found) return;
    const reply = { type: "image", id: m.id, sessionId: m.sessionId, ref: m.ref };
    if (found.error) {
      desk.send({ ...reply, error: found.error });
      return;
    }
    const pieces = Math.ceil(found.bytes.length / PIECE_BYTES);
    desk.send({ ...reply, mime: found.type, size: found.bytes.length, pieces });
    const rest = [];
    for (let index = 0; index < pieces; index++) {
      if (index === found.skip) continue;
      rest.push({ type: "imagePiece", id: m.id, index, data: found.bytes.slice(index * PIECE_BYTES, (index + 1) * PIECE_BYTES) });
    }
    rest.push({ type: "imageDone", id: m.id });
    const now = found.stopAfter === undefined ? rest : rest.slice(0, found.stopAfter);
    for (const piece of now) desk.send(piece);
    if (now.length < rest.length) desk.held[m.id] = rest.slice(now.length);
  }

  /** The connection waiting to be confirmed. */
  let waiting = null;

  const newSecret = () => toBase64Url(crypto.getRandomValues(new Uint8Array(32)));

  async function check(c, m, nonce) {
    // The desk's side of the link: its own certificate is the local one.
    const f = await negotiatedFingerprints(c.peerConnection);
    const fps = { app: f?.local ?? "", phone: f?.remote ?? "" };
    const key = m.kind === "pair" ? desk.code : desk.deviceKey;
    let ok = !!key && sameProof(await proof(key, "phone", nonce, fps.app, fps.phone), m.proof);
    if (ok && c.askedUV && m.kind === "device") {
      const why = await checkAssertion(c.askedUV, m.webauthn, await uvChallenge(nonce, fps.app, fps.phone));
      desk.uvChecks.push(why);
      ok = why === null;
      c.passedUV = ok;
    }
    if (!ok) {
      c.send({ v: 1, type: "goodbye", reason: "refused" });
      c.close();
      return;
    }
    const issued = m.kind === "pair" ? newSecret() : undefined;
    const appProof = await proof(desk.badProof ? newSecret() : key, "app", nonce, fps.app, fps.phone);
    if (issued) {
      desk.deviceKey = issued;
      desk.code = null;
    }
    c.send({ v: 1, type: "authed", proof: appProof, ...(issued ? { deviceKey: issued } : {}) });
    // As the app does: a phone asked to set up its screen lock gets nothing more until it has.
    if (c.askedEnrol) c.enrolling = true;
    else letIn(c);
  }

  function letIn(c) {
    if (desk.confirmPairing && !desk.confirmed) {
      // As the app does: nothing reaches a new pairing's phone until the PC confirms it.
      c.confirming = true;
      waiting = c;
      c.send({ v: 1, type: "confirmCode", code: desk.confirmCode });
      return;
    }
    c.authed = true;
    conn = c;
    desk.connections += 1;
  }

  async function enrol(c, m) {
    const answer = body => c.send({ v: 1, type: "enrolled", ...body });
    if (!c.enrolling) return answer({ ok: false, reason: "not asked" });
    const r = await checkEnrolment(m);
    if (typeof r === "string") return answer({ ok: false, reason: r });
    desk.uvCred = r;
    c.enrolling = false;
    c.passedUV = true;
    letIn(c);
    answer({ ok: true });
  }

  peer.on("connection", c => {
    let nonce = null;
    c.on("open", () => {
      if (desk.refuse) { c.close(); return; }
      if (desk.noAuth) {
        c.authed = true;
        conn = c;
        desk.connections += 1;
        return;
      }
      nonce = newSecret();
      c.askedUV = desk.requireUV ? desk.uvCred : null;
      c.askedEnrol = desk.requireUV && !desk.uvCred;
      c.send({
        v: 1, type: "challenge", nonce,
        ...(c.askedUV ? { requireUV: true } : c.askedEnrol ? { enrolUV: true } : {}),
        ...(desk.confirmPairing && !desk.confirmed ? { confirmPairing: true } : {}),
      });
    });
    c.on("data", m => {
      desk.received.push(m);
      if (c.confirming) return;
      if (c.enrolling) {
        if (m.type === "enrol") enrol(c, m);
        else {
          c.send({ v: 1, type: "goodbye", reason: "refused" });
          c.close();
        }
        return;
      }
      if (!c.authed) {
        if (m.type === "auth" && nonce) check(c, m, nonce);
        return;
      }
      if (m.type === "hello") {
        c.send({ v: 1, type: "welcome", deviceId: m.clientId, appVersion: desk.appVersion, features: desk.features });
        c.send({ v: 1, type: "sessions", sessions: desk.sessions });
      }
      if (m.type === "disconnect") {
        c.send({ v: 1, type: "goodbye", reason: "disconnected" });
        c.close();
      }
      if (m.type === "enrol") enrol(c, m);
      if (m.type === "openImage") answerImage(m);
      if (m.type === "cancelImage") desk.cancelled.push(m.id);
      if (m.type === "openSession") {
        const convo = example("conversation");
        c.send({ ...convo, sessionId: m.sessionId });
        c.send({ v: 1, type: "prompt", sessionId: m.sessionId, card: null });
      }
    });
  });
  await new Promise(resolve => peer.on("open", resolve));
  window.deskReady = true;
</script>
</body>
</html>
